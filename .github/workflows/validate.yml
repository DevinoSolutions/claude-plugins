name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Top-level skills/ mirror matches the plugin skills
        run: node scripts/sync-skills.mjs --check
      - name: Install the Claude Code CLI
        id: cli
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Validate marketplace, plugins and skills
        if: steps.cli.outcome == 'success'
        run: |
          set -e
          claude plugin validate --strict .
          for d in plugins/*/; do
            echo "== $d"
            claude plugin validate --strict "$d"
            claude plugin validate --strict "$d/skills"
          done
          claude plugin validate --strict skills
      - name: Report a skipped CLI validation
        if: steps.cli.outcome != 'success'
        run: echo "::warning::Claude Code CLI unavailable; skipped claude plugin validate. The sync check above still ran."
      - name: Every plugin is listed in the marketplace
        run: |
          set -e
          for d in plugins/*/; do
            n=$(basename "$d")
            grep -q "\"source\": \"./plugins/$n\"" .claude-plugin/marketplace.json || { echo "missing $n in marketplace.json"; exit 1; }
          done
